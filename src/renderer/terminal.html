<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude Code</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0d0d0d;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #titlebar {
      -webkit-app-region: drag;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      user-select: none;
      -webkit-user-select: none;
      flex-shrink: 0;
      position: relative;
    }
    #teamdash-btn {
      -webkit-app-region: no-drag;
      width: 28px; height: 28px;
      border: none; border-radius: 5px;
      background: transparent;
      color: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin-right: 10px;
      transition: all 0.15s;
      flex-shrink: 0;
      align-self: center;
    }
    #teamdash-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.7);
    }
    #teamdash-btn.active {
      color: rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.1);
    }
    #tabbar {
      display: flex;
      height: 28px;
      flex-shrink: 0;
      align-items: stretch;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      user-select: none;
      -webkit-user-select: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .tab {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      padding: 0 28px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s ease;
      gap: 8px;
      white-space: nowrap;
    }
    .tab:hover {
      color: rgba(255, 255, 255, 0.9);
      background: rgba(255, 255, 255, 0.04);
    }
    .tab.active {
      color: rgba(255, 255, 255, 0.95);
      border-bottom-color: currentColor;
    }
    .tab-icon {
      font-size: 11px;
      opacity: 0.7;
    }
    .tab-label[contenteditable="true"] {
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      padding: 0 4px;
      min-width: 30px;
    }
    .tab-close, .tab-action {
      width: 16px; height: 16px;
      border: none; border-radius: 3px;
      background: transparent;
      color: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      padding: 0;
      line-height: 1;
      margin-left: 2px;
    }
    .tab-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.8);
    }

    /* ─── Conversation link half-pills (top-right of terminal) ─── */
    #link-pills {
      position: absolute;
      top: 10px;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 6px;
      z-index: 110;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
    }
    #link-pills.off-tab { display: none; }
    .link-group { position: relative; display: none; }
    .link-group.has-links { display: flex; }
    .link-pill {
      width: 30px; height: 26px;
      border-radius: 13px 0 0 13px;
      background: var(--pill-bg, rgba(37, 17, 71, 0.85));
      border: 1px solid var(--pill-border, rgba(124, 58, 237, 0.4));
      border-right: none;
      color: var(--pill-fg, rgba(255, 255, 255, 0.92));
      display: flex; align-items: center; justify-content: center;
      padding-left: 3px;
      backdrop-filter: blur(6px);
      opacity: 0.55;
      transition: background 0.15s, width 0.15s, opacity 0.15s;
      cursor: default;
    }
    .link-group:hover .link-pill { background: var(--pill-bg-hover, rgba(52, 24, 100, 0.95)); width: 34px; opacity: 1; }
    /* Flyout sits to the left; padding-right bridges the gap so :hover isn't lost crossing it */
    .link-flyout {
      position: absolute;
      top: 0; right: 100%;
      padding-right: 6px;
      display: none;
    }
    .link-group:hover .link-flyout { display: block; }
    .link-panel {
      min-width: 240px; max-width: 420px;
      max-height: 320px; overflow-y: auto;
      background: rgba(18, 18, 22, 0.94);
      border: 1px solid var(--pill-border, rgba(124, 58, 237, 0.5));
      border-radius: 8px;
      padding: 4px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(10px);
    }
    .link-panel-title {
      font-size: 10px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
      color: rgba(255, 255, 255, 0.4);
      padding: 4px 4px 6px 8px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .link-clear {
      border: none; border-radius: 4px;
      background: transparent;
      color: rgba(255, 255, 255, 0.4);
      font: inherit; letter-spacing: inherit; text-transform: inherit;
      padding: 2px 6px;
      cursor: pointer;
    }
    .link-clear:hover { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.9); }
    /* Second click confirms */
    .link-clear.confirm { background: rgba(239, 68, 68, 0.18); color: #fca5a5; }
    .link-row {
      display: flex; align-items: center; gap: 2px;
      border-radius: 5px;
    }
    .link-row:hover { background: rgba(255, 255, 255, 0.06); }
    .link-label {
      flex: 1; min-width: 0;
      border: none; background: transparent;
      color: rgba(255, 255, 255, 0.85);
      font: inherit; font-size: 12px; text-align: left;
      padding: 6px 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer;
    }
    .link-label:hover { color: #fff; }
    .link-label.has-title { display: flex; align-items: center; gap: 8px; width: 340px; }
    .link-key { flex-shrink: 0; }
    /* Jira title: scrolls back and forth when it doesn't fit (distance/duration set from JS) */
    .link-title {
      flex: 1; min-width: 0;
      overflow: hidden;
      color: rgba(255, 255, 255, 0.5);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 6px, #000 calc(100% - 10px), transparent 100%);
    }
    .link-title-inner { display: inline-block; padding: 0 6px; }
    .link-title.scroll .link-title-inner {
      animation: link-marquee var(--scroll-duration, 6s) ease-in-out infinite alternate;
    }
    @keyframes link-marquee {
      0%, 12% { transform: translateX(0); }
      88%, 100% { transform: translateX(calc(-1 * var(--scroll-distance, 0px))); }
    }
    .link-action {
      width: 22px; height: 22px; flex-shrink: 0;
      border: none; border-radius: 4px;
      background: transparent;
      color: rgba(255, 255, 255, 0.35);
      font-size: 13px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
    }
    .link-action:hover { background: rgba(255, 255, 255, 0.1); color: rgba(255, 255, 255, 0.9); }
    .link-action.delete:hover { color: #f87171; }
    .link-action.done { color: #4ade80; }

    /* ─── Hover copy for Claude's messages (clean source text, no gutters/hard wraps) ─── */
    #message-copy {
      position: absolute;
      right: 6px;
      display: none;
      gap: 2px;
      padding: 2px;
      border-radius: 7px;
      background: var(--pill-bg, rgba(37, 17, 71, 0.85));
      border: 1px solid var(--pill-border, rgba(124, 58, 237, 0.4));
      backdrop-filter: blur(6px);
      z-index: 105;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      opacity: 0.55;
      transition: opacity 0.15s;
    }
    #message-copy.visible { display: flex; }
    #message-copy:hover { opacity: 1; }
    .message-copy-btn {
      display: flex; align-items: center; justify-content: center;
      width: 24px; height: 22px; padding: 0;
      border: none; border-radius: 5px;
      background: transparent;
      color: var(--pill-fg, rgba(255, 255, 255, 0.85));
      font: inherit; font-size: 11px; font-weight: 500;
      cursor: pointer; white-space: nowrap;
    }
    .message-copy-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
    .message-copy-btn .check { display: none; }
    .message-copy-btn.done { color: #4ade80; }
    .message-copy-btn.done .icon { display: none; }
    .message-copy-btn.done .check { display: block; }
    /* Tints exactly the rows the hovered copy button would take */
    #copy-highlight {
      position: absolute;
      display: none;
      pointer-events: none;
      background: var(--copy-hl, rgba(155, 107, 241, 0.3));
      border-left: 3px solid var(--copy-hl-edge, rgb(190, 157, 246));
      box-shadow: inset 0 0 0 1px var(--copy-hl-ring, rgba(172, 132, 243, 0.55));
      border-radius: 0 4px 4px 0;
      z-index: 104;
    }
    #copy-highlight.visible { display: block; }

    /* ─── Floating prompt toolbar (bottom-right of terminal) ─── */
    #prompt-toolbar {
      position: absolute;
      bottom: 8px;
      right: 10px;
      display: flex;
      gap: 4px;
      z-index: 100;
      opacity: 0.4;
      transition: opacity 0.2s;
    }
    #prompt-toolbar:hover { opacity: 1; }
    .prompt-tool-btn {
      width: 26px; height: 26px;
      border: none; border-radius: 6px;
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      transition: all 0.15s;
    }
    .prompt-tool-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.9);
    }
    .prompt-tool-btn svg { width: 14px; height: 14px; }
    #add-tab-btn {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      cursor: pointer;
      color: rgba(255, 255, 255, 0.3);
      transition: all 0.15s ease;
      font-size: 18px;
      flex-shrink: 0;
    }
    #add-tab-btn:hover {
      color: rgba(255, 255, 255, 0.8);
      background: rgba(255, 255, 255, 0.04);
    }

    /* ─── Main content area ─── */
    #main-area {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ─── Sidebar ─── */
    #sidebar {
      width: 36px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
      padding-bottom: 10px;
      gap: 6px;
      border-right: 1px solid rgba(255, 255, 255, 0.06);
      overflow-y: auto;
    }
    #sidebar::-webkit-scrollbar { width: 0; }
    #custom-snippets {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .snippet-separator {
      width: 20px;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
    }
    .sidebar-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.45);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      transition: all 0.15s ease;
      padding: 0;
    }
    .sidebar-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.8);
    }
    .sidebar-btn.active {
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.9);
    }
    .sidebar-btn.dragging {
      opacity: 0.3;
    }
    .sidebar-btn.drag-over {
      box-shadow: 0 -2px 0 0 rgba(255,255,255,0.4);
    }

    /* ─── Drop overlay ─── */
    #drop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #drop-overlay.visible { display: flex; }
    #drop-overlay-inner {
      border: 2px dashed rgba(255,255,255,0.4);
      border-radius: 12px;
      padding: 24px 36px;
      color: rgba(255,255,255,0.7);
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
      font-size: 14px;
      font-weight: 600;
    }

    /* ─── Terminal container ─── */
    #terminal-container {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .terminal-pane {
      position: absolute;
      inset: 0;
      display: none;
    }
    .terminal-pane.active {
      display: block;
    }
  </style>
</head>
<body>
  <div id="titlebar"></div>
  <div id="tabbar">
    <div id="tab-claude" class="tab active" data-tab="claude">
      <span class="tab-icon">&#10022;</span>
      <span>Claude</span>
    </div>
    <div id="add-tab-btn" title="New Tab">+</div>
    <div style="flex:1"></div>
    <button id="teamdash-btn" title="Agent Teams">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
        <circle cx="8" cy="4" r="2" stroke="currentColor" stroke-width="1.2"/>

  </div>
  <div id="main-area">
    <div id="sidebar">
      <button id="notes-btn" class="sidebar-btn sidebar-reorderable" data-sidebar-id="notes" title="Notes">

      </button>
      <button id="skills-btn" class="sidebar-btn sidebar-reorderable" data-sidebar-id="skills" title="Slash Commands">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M10 2.5L6 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>

      </button>
      <button id="skillbrowser-btn" class="sidebar-btn sidebar-reorderable" data-sidebar-id="skillbrowser" title="Skills">

      </button>
      <button id="model-btn" class="sidebar-btn sidebar-reorderable" data-sidebar-id="model" title="Switch Model">

      <button id="prompthistory-btn" class="sidebar-btn sidebar-reorderable" data-sidebar-id="prompthistory" title="Prompt History">

      <button id="stacks-btn" class="sidebar-btn sidebar-reorderable" data-sidebar-id="stacks" title="Stacks">

      <button id="openfolder-btn" class="sidebar-btn sidebar-reorderable" data-sidebar-id="openfolder" title="Open Folder">

      <button id="savepreset-btn" class="sidebar-btn sidebar-reorderable" data-sidebar-id="savepreset" title="Save as Preset">

      <button id="slack-btn" class="sidebar-btn sidebar-reorderable" data-sidebar-id="slack" title="Share to Slack">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">

          <path d="M8.834 5.042a2.528 2.528 0 0 1-2.521-2.52A2.528 2.528 0 0 1 8.834 0a2.528 2.528 0 0 1 2.521 2.522v2.52H8.834zm0 1.271a2.528 2.528 0 0 1 2.521 2.521 2.528 2.528 0 0 1-2.521 2.521H2.522A2.528 2.528 0 0 1 0 8.834a2.528 2.528 0 0 1 2.522-2.521h6.312z" fill="currentColor" opacity="0.7"/>
          <path d="M18.956 8.834a2.528 2.528 0 0 1 2.522-2.521A2.528 2.528 0 0 1 24 8.834a2.528 2.528 0 0 1-2.522 2.521h-2.522V8.834zm-1.268 0a2.528 2.528 0 0 1-2.523 2.521 2.527 2.527 0 0 1-2.52-2.521V2.522A2.527 2.527 0 0 1 15.165 0a2.528 2.528 0 0 1 2.523 2.522v6.312z" fill="currentColor" opacity="0.8"/>
          <path d="M15.165 18.956a2.528 2.528 0 0 1 2.523 2.522A2.528 2.528 0 0 1 15.165 24a2.527 2.527 0 0 1-2.52-2.522v-2.522h2.52zm0-1.268a2.527 2.527 0 0 1-2.52-2.523 2.526 2.526 0 0 1 2.52-2.52h6.313A2.527 2.527 0 0 1 24 15.165a2.528 2.528 0 0 1-2.522 2.523h-6.313z" fill="currentColor" opacity="0.6"/>
        </svg>
      </button>
      <button id="sharecontext-btn" class="sidebar-btn sidebar-reorderable" data-sidebar-id="sharecontext" title="Share Context">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <circle cx="12" cy="3.5" r="2" stroke="currentColor" stroke-width="1.1"/>
          <circle cx="4" cy="8" r="2" stroke="currentColor" stroke-width="1.1"/>
          <circle cx="12" cy="12.5" r="2" stroke="currentColor" stroke-width="1.1"/>
          <path d="M5.8 7.1l4.4-2.6M5.8 8.9l4.4 2.6" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
      </button>
      <div id="custom-snippets"></div>
      <button id="add-snippet-btn" class="sidebar-btn" title="Add Quick Snippet">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div id="terminal-container">
      <div id="terminal" class="terminal-pane active"></div>
      <div id="copy-highlight"></div>
      <div id="message-copy">
        <button class="message-copy-btn" data-mode="block" title="Copy this paragraph, list or quote">
          <svg class="icon" width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M7 13V3h5M10 3v10M7 3H6a3 3 0 0 0 0 6h1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg class="check" width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="message-copy-btn" data-mode="message" title="Copy Claude's whole message">
          <svg class="icon" width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2.5 4a1.5 1.5 0 0 1 1.5-1.5h8A1.5 1.5 0 0 1 13.5 4v5.5A1.5 1.5 0 0 1 12 11H7l-3 2.5V11a1.5 1.5 0 0 1-1.5-1.5V4z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.5 5.5h5M5.5 8h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          <svg class="check" width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="link-pills">
        <div class="link-group" data-kind="pr">
          <div class="link-pill"><svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M1.5 3.25a2.25 2.25 0 1 1 3 2.122v5.256a2.251 2.251 0 1 1-1.5 0V5.372A2.25 2.25 0 0 1 1.5 3.25Zm5.677-.177L9.573.677A.25.25 0 0 1 10 .854V2.5h1A2.5 2.5 0 0 1 13.5 5v5.628a2.251 2.251 0 1 1-1.5 0V5a1 1 0 0 0-1-1h-1v1.646a.25.25 0 0 1-.427.177L7.177 3.427a.25.25 0 0 1 0-.354ZM3.75 2.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm0 9.5a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Zm8.25.75a.75.75 0 1 0 1.5 0 .75.75 0 0 0-1.5 0Z"/></svg></div>
          <div class="link-flyout"><div class="link-panel"><div class="link-panel-title"><span>Pull requests</span><button class="link-clear" title="Remove every item from this list">Clear all</button></div><div class="link-list"></div></div></div>
        </div>
        <div class="link-group" data-kind="jira">
          <div class="link-pill"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M11.571 11.513H0a5.218 5.218 0 0 0 5.232 5.215h2.13v2.057A5.215 5.215 0 0 0 12.575 24V12.518a1.005 1.005 0 0 0-1.005-1.005zm5.723-5.756H5.736a5.215 5.215 0 0 0 5.215 5.214h2.129v2.058a5.218 5.218 0 0 0 5.215 5.214V6.758a1.001 1.001 0 0 0-1.001-1.001zM23.013 0H11.455a5.215 5.215 0 0 0 5.215 5.215h2.129v2.057A5.215 5.215 0 0 0 24 12.483V1.005A1.001 1.001 0 0 0 23.013 0Z"/></svg></div>
          <div class="link-flyout"><div class="link-panel"><div class="link-panel-title"><span>Jira tickets</span><button class="link-clear" title="Remove every item from this list">Clear all</button></div><div class="link-list"></div></div></div>
        </div>
        <div class="link-group" data-kind="artifact">
          <div class="link-pill"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><rect x="1.75" y="2.25" width="12.5" height="11.5" rx="1.75" stroke="currentColor" stroke-width="1.3"/><path d="M1.75 5.25h12.5" stroke="currentColor" stroke-width="1.3"/><path d="M8 7l.6 1.4L10 9l-1.4.6L8 11l-.6-1.4L6 9l1.4-.6z" fill="currentColor"/></svg></div>
          <div class="link-flyout"><div class="link-panel"><div class="link-panel-title"><span>Artifacts</span><button class="link-clear" title="Remove every item from this list">Clear all</button></div><div class="link-list"></div></div></div>
        </div>
        <div class="link-group" data-kind="file">
          <div class="link-pill"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M1.75 4.25c0-.83.67-1.5 1.5-1.5h3l1.5 1.75h5c.83 0 1.5.67 1.5 1.5v5.75c0 .83-.67 1.5-1.5 1.5H3.25c-.83 0-1.5-.67-1.5-1.5V4.25z" fill="currentColor" fill-opacity="0.25" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></div>
          <div class="link-flyout"><div class="link-panel"><div class="link-panel-title"><span>Local files</span><button class="link-clear" title="Remove every item from this list">Clear all</button></div><div class="link-list"></div></div></div>
        </div>
      </div>
      <div id="prompt-toolbar">
        <button class="prompt-tool-btn" id="copy-prompt-btn" title="Copy prompt to clipboard">
          <svg viewBox="0 0 16 16" fill="none"><rect x="5" y="5" width="8" height="8" rx="1" stroke="currentColor" stroke-width="1.3"/><path d="M3 10V3.5a.5.5 0 0 1 .5-.5H10" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        </button>
        <button class="prompt-tool-btn" id="clear-prompt-btn" title="Clear current prompt">
          <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div id="drop-overlay"><div id="drop-overlay-inner">Drop files here</div></div>
  <script type="module" src="./terminal-main.ts"></script>
</body>
</html>
